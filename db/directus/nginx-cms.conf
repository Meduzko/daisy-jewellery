# Directus admin panel — /etc/nginx/sites-available/cms.daisy-jewellery.com.ua
# Certificate: sudo certbot certonly --nginx -d cms.daisy-jewellery.com.ua
# Directus listens on 127.0.0.1:8055 only (compose.cms.yaml); PostgreSQL is never exposed.

server {
    listen 80;
    listen [::]:80;
    server_name cms.daisy-jewellery.com.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.daisy-jewellery.com.ua;

    ssl_certificate     /etc/letsencrypt/live/cms.daisy-jewellery.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.daisy-jewellery.com.ua/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m; # blog image uploads

    # Brute-force protection for the login form (define the zone in nginx.conf http {}:
    #   limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;)
    location = /auth/login {
        limit_req zone=cms_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8055;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8055;
        include /etc/nginx/proxy_params; # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_read_timeout 120s;
    }
}
