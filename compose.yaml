# Local development PostgreSQL (not used in production).
# Credentials come from .env.local:  npm run db:up  (= docker compose --env-file .env.local up -d --wait)
name: daisy-jewellery

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-daisy_dev}
    ports:
      - "127.0.0.1:5433:5432" # host loopback only
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker — mount the parent.
      - pgdata:/var/lib/postgresql
      # Runs once, on first start with an empty volume (creates daisy_test).
      - ./db/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
    name: daisy-jewellery-pgdata
